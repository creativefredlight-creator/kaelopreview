  <path d="M 16 22 C 20 16, 28 14, 34 14" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <ellipse cx="16.5" cy="24" rx="2.5" ry="1.5" transform="rotate(-30 16.5 24)" fill="#FFFFFF" opacity="0.95"/>
  <!-- Left Eye -->
