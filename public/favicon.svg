  </defs>
  <!-- Left Arm / Ear -->
  <ellipse cx="14" cy="22" rx="5" ry="7" fill="#8B5CF6" stroke="#111111" stroke-width="2.5" transform="rotate(-20 14 22)"/>
  <!-- Right Arm / Ear -->
  <ellipse cx="50" cy="22" rx="5" ry="7" fill="#8B5CF6" stroke="#111111" stroke-width="2.5" transform="rotate(20 50 22)"/>
