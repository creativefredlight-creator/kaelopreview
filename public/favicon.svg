  <ellipse cx="23" cy="33" rx="4.5" ry="5.5" fill="#111111"/>
  <circle cx="21.5" cy="30.5" r="2" fill="#FFFFFF"/>
  <circle cx="25" cy="35" r="1" fill="#FFFFFF"/>
  <!-- Right Eye -->
  <ellipse cx="42" cy="32" rx="8" ry="9" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <ellipse cx="41" cy="33" rx="4.5" ry="5.5" fill="#111111"/>
  <circle cx="39.5" cy="30.5" r="2" fill="#FFFFFF"/>
  <circle cx="43" cy="35" r="1" fill="#FFFFFF"/>
  <!-- Cheeks -->
  <ellipse cx="15" cy="38" rx="3.5" ry="2" fill="#D8B4FE" opacity="0.6"/>
  <ellipse cx="49" cy="38" rx="3.5" ry="2" fill="#D8B4FE" opacity="0.6"/>
  <!-- Smile -->
